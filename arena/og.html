<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

.sub{position:absolute;left:66px;top:418px;font-size:22px;color:#9AA39D}
.sub b{color:#F2F4F0;font-weight:500}.sub i{color:#39F194;font-style:normal}
.crown{position:absolute;right:92px;top:150px;width:330px;height:330px}
.foot{position:absolute;left:64px;bottom:52px;font-size:18px;color:#5E6663}
.bar{position:absolute;left:64px;right:64px;bottom:100px;height:6px;border-radius:3px;background:linear-gradient(90deg,#F2F4F0 0 50%,#39F194 50% 100%);opacity:.9}
